[project]
name = "codeatlas-cli"
version = "0.1.0"
description = "Local codebase intelligence engine: AST-driven code IR, knowledge graph, living wiki, and hybrid search CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Pratap Singh" }]
keywords = [
    "codebase-intelligence",
    "ast",
    "tree-sitter",
    "knowledge-graph",
    "living-wiki",
    "hybrid-search",
    "bm25",
    "developer-tools",
    "code-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "typer>=0.15.0",
    "rich>=14.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "fastembed>=0.6.0",
    "sqlite-vec>=0.1.6",
    "litellm>=1.50.0",
    "gitpython>=3.1.0",
    "networkx>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/adityaiitg/codeatlas"
Repository = "https://github.com/adityaiitg/codeatlas"
Issues = "https://github.com/adityaiitg/codeatlas/issues"

[project.optional-dependencies]
fast = [
    "model2vec>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "pre-commit>=3.5.0",
    "model2vec>=0.5.0",
]
all = [
    "model2vec>=0.5.0",
]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["._*", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["codeatlas"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["fixtures", "sample_project", ".*"]
